name: iOS → TestFlight

# Compiles the bare React Native iOS app with Xcode and uploads it straight to
# TestFlight via Fastlane, using an App Store Connect API key with Xcode cloud
# signing (Xcode creates/manages the signing cert + provisioning profile). Only
# your Apple Developer account is involved — no Expo, no EAS, no second account.
#
# Trigger: push a version tag (e.g. v0.1.0) or run it manually.
#
# Required GitHub secrets:
#   APPSTORE_API_KEY_ID       App Store Connect API key ID
#   APPSTORE_API_PRIVATE_KEY  contents of the .p8 key (raw PEM, or base64)
#   APPSTORE_ISSUER_ID        Issuer ID from the App Store Connect Keys page
# Team ID is set in fastlane/Appfile (not secret). See docs/TESTFLIGHT.md.

on:
  push:
    branches:
      - "claude/stoic-newton-or77ao"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify iOS 26 SDK is available
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9.]+' | sed 's/iphoneos//' | sort -V | tail -1)
          echo "Latest iOS SDK on runner: ${SDK:-none}"
          major=${SDK%%.*}
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::App Store now requires the iOS 26 SDK (Xcode 26) but this runner's newest is ${SDK:-none}. Bump the runner image."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # Accept either the raw PEM (-----BEGIN PRIVATE KEY-----) or a base64 blob.
          if printf '%s' "$APPSTORE_API_PRIVATE_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APPSTORE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="ci-build-keychain"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          # Put our keychain first in the search list (keep the existing ones)
          # and make it the default so xcodebuild/codesign use it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Build & upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: bundle exec fastlane ios beta
